name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check:types

      - name: Test
        run: bun test

      - name: Compile verifier bridge
        run: python -m compileall -q python/verify.py

      - name: Validate marketplace catalog
        run: bun run check:catalog

      - name: Package surface
        run: bun pm pack --dry-run
