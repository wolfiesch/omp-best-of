name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bun ${{ matrix.bun-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3.0", "1.3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint
        run: bun run check:biome

      - name: Type check
        run: bun run check:types

      - name: Test
        run: bun test

      - name: Compile verifier bridge
        run: python -m compileall -q python/verify.py

      - name: Validate marketplace catalog
        run: bun run check:catalog

      - name: Packed CLI smoke test
        if: matrix.bun-version == '1.3.14'
        run: bun run smoke:package

  required:
    name: Type check and tests
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm Bun matrix passed
        run: test "${{ needs.check.result }}" = "success"
